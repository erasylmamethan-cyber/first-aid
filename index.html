<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Первая помощь</title>
<meta name="description" content="Пошаговая первая помощь: без сознания и реанимация с метрономом, кровотечение, удушье, ожог, низкий сахар. Работает без интернета.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Первая помощь">
<style>
*{box-sizing:border-box}
/* Layout: one-column phone app, max 460px; every step fits one screen, no scrolling during an emergency */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#111827; --muted:#4B5563; --line:#E5E7EB;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#FFF1F2; --accent-deep:#9F1239;
  --strong:#111827; --strong-ink:#FFFFFF; --info-bg:#EFF4FF; --info-fg:#1E3A8A; --calm:#1D4ED8;
  --warn-bg:#FFF7E6; --warn-fg:#7A4100; --scrim:rgba(17,24,39,.55);
  --font:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#1A1D24; --fg:#F3F4F6; --muted:#A7ADB8; --line:#2A2F39;
  --accent:#D91F3A; --accent-ink:#FFFFFF; --accent-soft:#2A1519; --accent-deep:#FF9AA8;
  --strong:#F3F4F6; --strong-ink:#0F1115; --info-bg:#172036; --info-fg:#C7D7FF; --calm:#5B8CFF;
  --warn-bg:#2B2210; --warn-fg:#FFD58A; --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#1A1D24; --fg:#F3F4F6; --muted:#A7ADB8; --line:#2A2F39;
  --accent:#D91F3A; --accent-ink:#FFFFFF; --accent-soft:#2A1519; --accent-deep:#FF9AA8;
  --strong:#F3F4F6; --strong-ink:#0F1115; --info-bg:#172036; --info-fg:#C7D7FF; --calm:#5B8CFF;
  --warn-bg:#2B2210; --warn-fg:#FFD58A; --scrim:rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
[hidden]{display:none!important}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button,a{font:inherit}
:focus-visible{outline:3px solid var(--calm);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:8px 2px;min-height:50px}
.icon-btn{width:46px;height:46px;border-radius:23px;border:0;background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;margin-left:-10px;cursor:pointer}
.pill-103{border:0;background:var(--accent);color:var(--accent-ink);height:42px;padding:0 16px;border-radius:21px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;cursor:pointer}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:8px 6px}
.bottom{display:flex;flex-direction:column;gap:8px;padding-block:6px 12px}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.big{min-height:56px;border-radius:18px;border:0;font-size:18px;font-weight:800;cursor:pointer;padding:6px 18px;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;line-height:1.2}
.big.dark{background:var(--strong);color:var(--strong-ink)}
.big.red{background:var(--accent);color:var(--accent-ink)}
.big.light{background:var(--surface);color:var(--fg);border:2px solid var(--line)}
.big.small{min-height:48px;font-size:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.link-btn{min-height:40px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer}

/* steps */
ol.do{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:d}
ol.do li{counter-increment:d;display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.35}
ol.do li::before{content:counter(d);flex-shrink:0;width:26px;height:26px;border-radius:13px;background:var(--strong);color:var(--strong-ink);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
ol.do b{font-weight:800}
.alert{background:var(--accent-soft);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14.5px;line-height:1.35}
.alert strong{color:var(--accent-deep)}
.alert .small-btn{flex-shrink:0;background:var(--accent);color:var(--accent-ink);border:0;padding:0 12px}
.note{background:var(--info-bg);color:var(--info-fg);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4}
.small-btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.step-no{font-size:14px;font-weight:700;color:var(--accent-deep)}

/* home & list */
.call-card{border:0;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:24px;min-height:96px;padding:0 20px;display:flex;align-items:center;gap:16px;cursor:pointer;text-align:left}
.call-card .ring{width:60px;height:60px;border-radius:30px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.call-card b{display:block;font-size:24px;font-weight:800}
.call-card span{font-size:15px;opacity:.92}
.sit{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:20px;min-height:68px;padding:0 18px;display:flex;align-items:center;gap:14px;font-size:20px;font-weight:800;text-align:left;cursor:pointer}
.sit.primary{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.sit svg{flex-shrink:0;color:var(--accent)}
.sit.primary svg{color:inherit}
.list-item{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;min-height:64px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}
.list-item[disabled]{cursor:default;opacity:.62}
.list-item .t{font-size:17px;font-weight:700;display:block}
.list-item .s{font-size:14px;color:var(--muted);display:block;margin-top:2px}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent-deep);flex-shrink:0}
.tag.soon{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* metronome */
.metro{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;flex:1;min-height:0}
.metro-text{width:100%;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.35;background:var(--surface);border:1px solid var(--line)}
.metro-text.breath{background:var(--calm);color:#FFFFFF;border-color:var(--calm);font-size:19px;font-weight:700}
.beat{width:min(190px, 27vh);height:min(190px, 27vh);border-radius:50%;background:#9F1239;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform 90ms ease-out, background 200ms;flex-shrink:0}
.beat.run{background:#C8102E}
.beat.breath{background:#1D4ED8}
.beat.hit{transform:scale(1.08)}
.beat b{font-size:clamp(40px, 8vh, 58px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.beat span{font-size:15px;font-weight:600;opacity:.92}
.metro-hint{font-size:17px;font-weight:700;line-height:1.3;color:var(--accent-deep)}
.metro-hint.breath{color:var(--calm)}

/* timer */
.timer{background:var(--info-bg);color:var(--info-fg);border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer b{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer .small-btn{background:var(--strong);color:var(--strong-ink);border:0}

/* call */
.num-card{border:0;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left}
.num-card b{font-size:50px;font-weight:800;letter-spacing:-.02em;line-height:1}
.num-row{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;color:var(--fg);font-weight:600;cursor:pointer;text-align:left}
.num-row b{font-size:26px;font-weight:800}
ol.say{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ol.say li{display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.35}
ol.say li span{width:28px;height:28px;border-radius:14px;background:var(--strong);color:var(--strong-ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.loc .addr{font-size:20px;font-weight:800;line-height:1.25;user-select:all}
.loc .near{font-size:15px;line-height:1.4;color:var(--muted)}
.loc .row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-inline:calc(-1 * max(14px, env(safe-area-inset-left, 0px)));padding:4px 8px 8px;background:var(--surface)}
.tabs button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;min-height:50px;cursor:pointer}
.tabs button.on{color:var(--accent)}

/* call confirmation sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:28px 28px 0 0;padding:22px max(20px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:24px;font-weight:800}
.sheet .num{font-size:44px;font-weight:800;color:var(--accent);line-height:1}
@media (max-height: 700px){
  h1{font-size:22px}
  .scroll{gap:8px;padding-block:6px 4px}
  ol.do{gap:6px}
  ol.do li{font-size:15.5px;line-height:1.3}
  ol.do li::before{width:23px;height:23px;font-size:13px}
  .alert{font-size:13.5px;padding:8px 10px}
  .note,.warn{font-size:14px;padding:8px 10px}
  .big{min-height:50px;font-size:17px}
  .big.small{min-height:44px;font-size:15px}
  .top{min-height:46px;padding-block:6px 0}
  .link-btn{min-height:36px}
}
@media (prefers-reduced-motion: reduce){.beat{transition:none}.beat.hit{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h2 id="sheetTitle">Позвонить в скорую?</h2>
    <div class="num" id="sheetNum">103</div>
    <p class="muted" style="font-size:15px">Звонок экстренный. Подтвердите, что вызов нужен.</p>
    <a class="big red" id="sheetCall" href="tel:103">Да, позвонить 103</a>
    <button class="big light small" id="sheetCancel">Отмена</button>
  </div>
</div>

<script>
(function(){
const I = {
  phone:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  person:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="9" r="2.5"/><path d="M10 12h10a2 2 0 0 1 2 2v3H3v-3a2 2 0 0 1 2-2h1"/><path d="M3 17v2M22 17v2"/></svg>',
  drop:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7C9 7 6 10.3 6 14a6 6 0 0 0 12 0c0-3.7-3-7-6-11.3z"/></svg>',
  choke:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M9 13v3h6v-3"/><path d="M8 20h8"/></svg>',
  fire:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-1 2-2 3-3 3 0-2-1-4-3-6 0 4-4 7-4 13 0 4 3 7 7 7z"/></svg>',
  sugar:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M12 12h.01M9 15h.01M15 15h.01"/></svg>',
  close:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'
};

/* Каждый шаг — указание, коротко, без прокрутки. Ключевые слова в <b>.
   go: 'next' | число (индекс шага) | 'done:<id>' | 'call' (подтверждение звонка) | 'flow:<id>:<шаг>' */
const FLOWS = {
  cpr: { name:'Без сознания', steps:[
    { title:'Убедитесь, что вам ничего не угрожает',
      list:['Дорога, огонь, ток, газ, обрушение — <b>сначала уберите опасность</b> или отойдите.','Помогать можно только там, где <b>безопасно вам</b>.'],
      btns:[{label:'Безопасно — дальше', go:'next'}] },
    { title:'Проверьте сознание и дыхание',
      list:['Громко окликните, <b>потрясите за плечи</b>.','Нет ответа — <b>запрокиньте голову</b>, поднимите подбородок.','<b>10 секунд смотрите на грудную клетку</b>: поднимается или нет? Слушайте и ощущайте дыхание щекой.'],
      note:'Редкие хрипящие вдохи — это <b>не дыхание</b>. Пульс искать не нужно: нет нормального дыхания — значит, сердце остановилось.',
      btns:[{label:'Не дышит или хрипит', go:'next', style:'red'}, {label:'Дышит нормально', go:'done:breathing', style:'light'}] },
    { title:'Позвоните 103 и найдите дефибриллятор',
      list:['Позвоните <b>103</b>, включите громкую связь, положите телефон рядом.','Пусть кто-нибудь <b>принесёт дефибриллятор</b> (АНД), если он есть рядом. Он сам говорит, что делать.','Положите человека <b>на спину, на твёрдое</b>.'],
      btns:[{label:'Начать реанимацию', go:'next', style:'red'}, {label:'Позвонить 103', go:'call', style:'light'}] },
    { kind:'metro' }
  ]},
  bleed: { name:'Сильно кровоточит', steps:[
    { title:'Сразу прижмите рану',
      list:['Положите на рану <b>сложенную ткань</b>: бинт, футболку, шарф.','<b>Давите ладонью сильно</b>, всем весом.','Держите <b>не меньше 10 минут</b>, не подглядывайте.'],
      warn:'Рана на <b>шее, груди или животе</b> — только давите, <b>перетягивать нельзя</b>. Торчит предмет — не вынимайте, давите по бокам.',
      btns:[{label:'Прижал(а) — дальше', go:'next'}, {label:'Нет бинта или ткани', go:'done:cloth', style:'light', small:true}] },
    { title:'Наложите давящую повязку',
      list:['Ткань с раны <b>не убирайте</b>.','Сверху — <b>плотный валик</b>: нераспечатанный бинт или свёрнутая ткань.','<b>Туго прибинтуйте</b>, витки внахлёст.','Узел — <b>сбоку</b>, не на ране.','Пальцы ниже <b>синеют или немеют</b> — чуть ослабьте.'],
      btns:[{label:'Кровь остановилась', go:'done:bleed'}, {label:'Повязка промокла', go:'next', style:'light'}] },
    { title:'Повязка промокла',
      list:['Старую повязку <b>не снимайте</b>.','Сверху — <b>ещё ткань</b>, снова туго прибинтуйте.','Снова <b>сильно давите</b> рукой.'],
      btns:[{label:'Кровь остановилась', go:'done:bleed'}, {label:'Рука или нога: кровь не останавливается', go:'next', style:'red'}] },
    { title:'Перетяните руку или ногу выше раны',
      list:['<b>Это не повязка.</b> Жгут — тугая перетяжка, которая пережимает всю конечность.','Место — <b>на 5–7 см выше раны</b>, не на сустав.','Жгут, <b>ремень или полоса ткани</b> шириной от 4 см. Не верёвка и не провод.','Завяжите, вставьте <b>палку или ручку</b> и закручивайте, <b>пока кровь не остановится</b>.','<b>Запишите время</b> на коже или на жгуте.'],
      warn:'<b>Не ослабляйте и не снимайте</b> — это сделают врачи.',
      btns:[{label:'Перетянул(а)', go:'done:tourniquet'}] }
  ]},
  choke: { name:'Подавился', steps:[
    { title:'Спросите: «Вы подавились?»',
      list:['<b>Кашляет</b> — пусть кашляет, по спине не стучите.','<b>Не может говорить, кашлять, дышать</b>, хватается за горло — действуйте сразу.'],
      btns:[{label:'Не может дышать', go:'next', style:'red'}, {label:'Кашляет', go:'done:cough', style:'light'}] },
    { title:'5 ударов по спине',

/* ---------- звук, метроном, таймер ---------- */
let ctx = null, wake = null;
function ensureAudio(){ try{ if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); } if(ctx && ctx.resume) ctx.resume(); }catch(e){} }
function tone(freq, dur, vib){
  try{ if(ctx){ const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);} }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(vib); }catch(e){}
}
async function lockScreen(on){
  try{
    if(on && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null}); }
    if(!on && wake){ await wake.release(); wake=null; }
  }catch(e){ wake=null; }
}
// 110 в минуту, 30 нажатий : 2 вдоха
const M = { running:false, count:0, phase:'press', timer:null, tick2:null, nextAt:0, breathEnd:0, bpm:110, startedAt:0 };
function metroStart(){
  ensureAudio(); lockScreen(true);
  clearTimeout(M.timer); clearInterval(M.tick2);
  if(!M.startedAt) M.startedAt = Date.now();
  M.running = true; M.phase = 'press'; M.nextAt = Date.now(); metroTick(); paintMetro();
}
function metroStop(){ clearTimeout(M.timer); clearInterval(M.tick2); M.running=false; if(M.phase==='breath') M.phase='press'; paintMetro(); }
function metroReset(){ metroStop(); M.count=0; M.phase='press'; M.startedAt=0; lockScreen(false); }
function metroTick(){
  if(!M.running || M.phase!=='press') return;
  M.count++;
  tone(M.count===1 ? 1320 : 880, 0.06, 35);
  const el = document.getElementById('beat');
  if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),110); }
  paintMetro();
  M.nextAt += 60000/M.bpm;
  const wait = Math.max(0, M.nextAt - Date.now());
  M.timer = setTimeout(M.count>=30 ? breathStart : metroTick, wait);
}
function breathStart(){
  if(!M.running) return;
  M.phase='breath'; M.breathEnd = Date.now()+6000;
  tone(440, 0.4, 250);
  clearInterval(M.tick2); M.tick2 = setInterval(()=>{ if(Date.now()>=M.breathEnd) breathEnd(); else paintMetro(); }, 250);
  paintMetro();
}
function breathEnd(){
  clearInterval(M.tick2); M.phase='press'; M.count=0;
  if(M.running){ M.nextAt = Date.now(); metroTick(); }
  paintMetro();
}
function paintMetro(){
  const el = document.getElementById('beat'); if(!el) return;
  const breath = M.phase==='breath';
  el.classList.toggle('run', M.running && !breath);
  el.classList.toggle('breath', breath);
  const n = document.getElementById('beatN'), l = document.getElementById('beatL'), h = document.getElementById('metroHint'), tx = document.getElementById('metroText');
  if(breath){
    n.textContent = '2'; l.textContent = 'вдоха · ' + Math.max(0, Math.ceil((M.breathEnd-Date.now())/1000)) + ' с';
    tx.innerHTML = 'Запрокиньте голову, зажмите нос.<br>2 вдоха рот в рот по 1 секунде.<br>Смотрите: <u>грудь поднимается?</u>';
    h.textContent = 'Сделайте 2 вдоха';
  } else {
    n.textContent = M.count; l.textContent = 'из 30';
    tx.innerHTML = 'Основание ладони — <b>в центр груди</b>, руки прямые. Продавливайте на <b>5–6 см</b> на каждый сигнал.';
    h.textContent = M.running ? (M.count>=25 ? 'Скоро 2 вдоха' : 'Нажимайте на каждый сигнал') : 'Пауза — продолжите как можно скорее';
  }
  tx.className = 'metro-text' + (breath ? ' breath' : '');
  h.className = 'metro-hint' + (breath ? ' breath' : '');
  const b = document.getElementById('metroBtn');
  if(breath){ b.textContent = 'Вдохи сделаны'; b.className = 'big dark'; }
  else { b.textContent = M.running ? 'Пауза' : 'Продолжить'; b.className = 'big ' + (M.running ? 'light' : 'red'); }
}

const T = { end:0, timer:null, total:0 };
function timerStart(min){ ensureAudio(); T.total = min*60; T.end = Date.now() + T.total*1000; clearInterval(T.timer); T.timer = setInterval(paintTimer, 500); paintTimer(); }
function paintTimer(){
  const el = document.getElementById('tLeft'); if(!el) return;
  const st = FLOWS[S.flow].steps[S.step];
  const total = st.minutes*60;
  const active = T.end && T.total===total;
  const left = active ? Math.max(0, Math.round((T.end - Date.now())/1000)) : total;
  el.textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
  const btn = document.getElementById('tBtn');
  if(active && left===0){ btn.hidden = false; btn.disabled = true; btn.textContent = 'Время вышло'; }
  else { btn.hidden = !!active; }
  if(active && left===0 && T.timer){ clearInterval(T.timer); T.timer=null; tone(660,0.5,[200,100,200]); }
}

/* ---------- подтверждение звонка ---------- */
const sheet = document.getElementById('sheet');
function askCall(num){
  num = num || '103';
  document.getElementById('sheetNum').textContent = num;
  document.getElementById('sheetTitle').textContent = num==='103' ? 'Позвонить в скорую?' : 'Позвонить в службу спасения?';
  const a = document.getElementById('sheetCall'); a.href = 'tel:' + num; a.textContent = 'Да, позвонить ' + num;
  sheet.hidden = false; a.focus();
}
function closeSheet(){ sheet.hidden = true; }
sheet.addEventListener('click', e => { if(e.target===sheet || e.target.id==='sheetCancel') closeSheet(); });
document.getElementById('sheetCall').addEventListener('click', () => setTimeout(closeSheet, 300));
document.addEventListener('keydown', e => { if(e.key==='Escape' && !sheet.hidden) closeSheet(); });

/* ---------- навигация ---------- */
function snapshot(){ return {screen:S.screen, flow:S.flow, step:S.step, done:S.done}; }
function go(screen, extra){ S.hist.push(snapshot()); Object.assign(S, {screen}, extra||{}); afterNav(); }
function back(){
  const prev = S.hist.pop();
  if(!prev) S.screen='home'; else Object.assign(S, prev);
  afterNav();
}
function home(){ metroReset(); S.hist=[]; S.screen='home'; render(); }
function isMetro(){ return S.screen==='flow' && FLOWS[S.flow].steps[S.step].kind==='metro'; }
function afterNav(){
  if(isMetro()){ if(!M.running){ M.count=0; metroStart(); } }
  else metroStop();
  render();
}
function act(btn){
  const g = btn.go;
  if(g==='call') return askCall('103');
  if(g==='back') return back();
  if(g==='next') return go('flow', {step:S.step+1});
  if(typeof g==='number') return go('flow', {step:g});
  if(g.startsWith('done:')) return go('done', {done:g.slice(5)});
  if(g.startsWith('flow:')){ const p = g.split(':'); return go('flow', {flow:p[1], step:+p[2]||0}); }
}

function vFlow(){
  const f = FLOWS[S.flow], st = f.steps[S.step], n = f.steps.length;
  const prog = '<div class="progress" role="img" aria-label="Шаг '+(S.step+1)+' из '+n+'">' + f.steps.map((_,k)=>'<i class="'+(k<=S.step?'on':'')+'"></i>').join('') + '</div>';
  const head = topBar('<button class="icon-btn" data-a="home" aria-label="Закрыть">'+I.close+'</button>') + prog;
  const prevBtn = S.hist.length && S.hist[S.hist.length-1].screen==='flow' ? '<button class="link-btn" data-a="back">← Предыдущий шаг</button>' : '';
  if(st.kind==='metro'){
    return head + '<div class="scroll" style="overflow:hidden"><div class="metro">' +
      '<h1>Давите на грудь в такт</h1>' +
      '<div id="metroText" class="metro-text" aria-live="assertive"></div>' +
      '<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center"><div id="beat" class="beat" aria-hidden="true"><b id="beatN">0</b><span id="beatL">из 30</span></div></div>' +

      '<button class="big light" data-a="woke">Очнулся / задышал</button></div>' + prevBtn + '</div>';
  }
  const body = (S.step===0 ? HELP_ALERT : '') + '<span class="step-no">Шаг '+(S.step+1)+' из '+n+'</span><h1>'+st.title+'</h1>' + stepBody(st) +
    (st.kind==='timer' ? '<div class="timer"><b id="tLeft">'+st.minutes+':00</b><button id="tBtn" class="small-btn" data-a="timer">Запустить таймер</button></div>' : '');
  return head + '<div class="scroll">'+body+'</div><div class="bottom">'+buttons(st.btns,'data-btn',st)+prevBtn+'</div>';
}
function vDone(){
  const d = DONE[S.done];
  return topBar('<button class="icon-btn" data-a="home" aria-label="Закрыть">'+I.close+'</button>') +
    '<div class="scroll" style="padding-top:12px"><h1>'+d.title+'</h1>'+listHtml(d.list)+'</div>' +
    '<div class="bottom">' + buttons(d.btns||[], 'data-dbtn') + (d.btns && d.btns[0].go==='back' ? '' : '<button class="big light small" data-a="home">На главную</button>') + '</div>';
}
function vCall(){
  const fromFlow = S.hist.some(h=>h.screen==='flow');
  return '<div class="top"><button class="icon-btn" data-a="back" aria-label="Назад">'+I.back+'</button></div>' +
    '<div class="scroll">' +
    '<h1>Экстренный вызов</h1>' +
    '<button class="num-card" data-call="103"><div><span style="font-size:15px;font-weight:600;opacity:.92">Скорая помощь</span><br><b>103</b></div><div class="call-card" style="width:auto;min-height:0;padding:0;background:transparent"><div class="ring">'+I.phone.replace(/24/g,'28')+'</div></div></button>' +
    '<button class="num-row" data-call="112"><span>Единая служба спасения</span><b>112</b></button>' +
    '<div class="loc"><span class="muted" style="font-size:14px;font-weight:600">Где вы находитесь</span>' +
      '<div id="locAddr" class="addr">Нажмите «Определить адрес»</div><div id="locNear" class="near" hidden></div>' +
      '<div class="row"><button class="small-btn" data-a="locate">Определить адрес</button><button class="small-btn" data-a="copyloc" id="copyBtn" hidden>Скопировать</button><a class="small-btn" id="mapLink" hidden target="_blank" rel="noopener">На карте</a></div></div>' +
    '<h2 style="margin-top:4px">Что сказать диспетчеру</h2>' +
    '<ol class="say"><li><span>1</span>Адрес: улица, дом, подъезд, этаж</li><li><span>2</span>Что случилось и сколько пострадавших</li><li><span>3</span>Возраст, есть ли сознание и дыхание</li><li><span>4</span>Ваш номер телефона</li></ol>' +
    '<div class="note">Не кладите трубку первым — диспетчер подскажет, что делать.</div>' +
    '</div>' + (fromFlow ? '<div class="bottom"><button class="big dark" data-a="back">Вернуться к инструкции</button></div>' : tabs());
}

function render(){
  const v = {home:vHome, list:vList, flow:vFlow, done:vDone, call:vCall}[S.screen];
  app.innerHTML = v();
  if(isMetro()) paintMetro();
  if(S.screen==='flow' && FLOWS[S.flow].steps[S.step].kind==='timer') paintTimer();
  if(S.screen==='call' && LOC.addr) paintLoc();
  const sc = app.querySelector('.scroll'); if(sc) sc.scrollTop = 0;
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.flow){ metroReset(); S.hist=[{screen:'home'}]; Object.assign(S,{screen:'flow', flow:t.dataset.flow, step:0}); render(); return; }
  if(t.dataset.btn!==undefined){ act(FLOWS[S.flow].steps[S.step].btns[+t.dataset.btn]); return; }
  if(t.dataset.dbtn!==undefined){ act(DONE[S.done].btns[+t.dataset.dbtn]); return; }
  if(t.dataset.call){ askCall(t.dataset.call); return; }
  const a = t.dataset.a;
  if(a==='home') home();
  else if(a==='list'){ S.hist=[]; S.screen='list'; render(); }
  else if(a==='call') askCall('103');
  else if(a==='callscreen'){ S.hist=[]; S.screen='call'; render(); }
  else if(a==='back') back();
  else if(a==='metro'){ if(M.phase==='breath') breathEnd(); else (M.running ? metroStop() : metroStart()); }
  else if(a==='woke'){ const mins = M.startedAt ? Math.max(1, Math.round((Date.now()-M.startedAt)/60000)) : 0; metroStop(); lockScreen(false); go('done', {done:'woke'}); if(mins){ const h=app.querySelector('h1'); if(h) h.insertAdjacentHTML('afterend','<div class="note">Реанимация длилась около <b>'+mins+' мин</b>.</div>'); } }
  else if(a==='timer') timerStart(FLOWS[S.flow].steps[S.step].minutes);
  else if(a==='locate') locate();
  else if(a==='copyloc') copyLoc();
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && M.running) lockScreen(true); });

/* ---------- местоположение: улица, дом и ближайшие дома (OpenStreetMap) ---------- */
const LOC = { lat:0, lon:0, addr:'', near:[], acc:0 };
function withTimeout(promise, ms){ return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]); }
function dist(a,b,c,d){ const R=6371000, x=(d-b)*Math.PI/180*Math.cos((a+c)/2*Math.PI/180), y=(c-a)*Math.PI/180; return Math.round(Math.sqrt(x*x+y*y)*R); }
function streetLine(t){
  const street = t['addr:street'] || t.road || t.pedestrian || t.footway || t.residential || '';
  const house = t['addr:housenumber'] || t.house_number || '';
  return [street, house].filter(Boolean).join(', ');
}
function paintLoc(){
  const a = document.getElementById('locAddr'); if(!a) return;
  a.textContent = LOC.addr || 'Адрес не найден';
  const n = document.getElementById('locNear');
  if(LOC.near.length){ n.hidden = false; n.innerHTML = 'Рядом: ' + LOC.near.map(x=>x.t+' — '+x.d+' м').join('; '); } else n.hidden = true;
  const c = document.getElementById('copyBtn'); if(c) c.hidden = !LOC.addr;
  const m = document.getElementById('mapLink'); if(m && LOC.lat){ m.hidden = false; m.href = 'https://www.google.com/maps?q=' + LOC.lat + ',' + LOC.lon; }
}
function locate(){
  const el = document.getElementById('locAddr');
  if(!navigator.geolocation){ el.textContent = 'Телефон не поддерживает определение места. Назовите адрес по табличке на доме.'; return; }
  el.textContent = 'Определяю…';
  navigator.geolocation.getCurrentPosition(async p => {
    LOC.lat = +p.coords.latitude.toFixed(6); LOC.lon = +p.coords.longitude.toFixed(6); LOC.acc = Math.round(p.coords.accuracy);
    LOC.addr = ''; LOC.near = [];
    const e1 = document.getElementById('locAddr'); if(e1) e1.textContent = 'Ищу улицу и дом…';
    try{
      const r = await withTimeout(fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=ru&lat='+LOC.lat+'&lon='+LOC.lon), 9000);
      const j = await r.json(); const ad = j.address || {};
      const line = streetLine(ad);
      const place = ad.city || ad.town || ad.village || ad.county || '';
      LOC.addr = [line, place].filter(Boolean).join(', ');
    }catch(e){}
    try{
      const q = '[out:json][timeout:8];nwr(around:80,'+LOC.lat+','+LOC.lon+')["addr:housenumber"];out center 12;';
      const r = await withTimeout(fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q)), 10000);
      const j = await r.json();
      const seen = new Set();
      LOC.near = (j.elements||[]).map(x => {
        const la = x.lat || (x.center && x.center.lat), lo = x.lon || (x.center && x.center.lon);
        return { t: streetLine(x.tags||{}), d: la ? dist(LOC.lat, LOC.lon, la, lo) : 9999 };
      }).filter(x => x.t && !seen.has(x.t) && seen.add(x.t)).sort((a,b)=>a.d-b.d).slice(0,3);
    }catch(e){}
    if(!LOC.addr && LOC.near.length) LOC.addr = LOC.near[0].t;
    if(!LOC.addr) LOC.addr = 'Нет интернета для поиска адреса. Координаты: ' + LOC.lat + ', ' + LOC.lon;
    paintLoc();
  }, err => {
    const e2 = document.getElementById('locAddr'); if(!e2) return;
    e2.textContent = err.code === 1 ? 'Нет разрешения на геолокацию. Назовите адрес по табличке на доме.' : 'Не удалось определить. Назовите адрес по табличке на доме.';
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}
function copyLoc(){
  const c = document.getElementById('copyBtn');
  const text = LOC.addr + (LOC.lat ? ' (' + LOC.lat + ', ' + LOC.lon + ')' : '');
  try{ navigator.clipboard.writeText(text).then(()=>{ if(c) c.textContent = 'Скопировано'; }, ()=>{}); }catch(e){}
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
render();
})();
</script>
