<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Первая помощь</title>
<meta name="description" content="Пошаговая первая помощь: реанимация с метрономом, кровотечение, удушье, ожог. Работает без интернета.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Первая помощь">
<style>
*{box-sizing:border-box}
/* Layout: one-column phone app, max 460px, centered on desktop; huge tap targets for a reader in panic */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#111827; --muted:#4B5563; --line:#E5E7EB;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#FFF1F2; --accent-deep:#9F1239;
  --strong:#111827; --strong-ink:#FFFFFF; --info-bg:#EFF4FF; --info-fg:#1E3A8A; --calm:#1D4ED8;
  --font:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#1A1D24; --fg:#F3F4F6; --muted:#A7ADB8; --line:#2A2F39;
  --accent:#D91F3A; --accent-ink:#FFFFFF; --accent-soft:#2A1519; --accent-deep:#FF9AA8;
  --strong:#F3F4F6; --strong-ink:#0F1115; --info-bg:#172036; --info-fg:#C7D7FF; --calm:#5B8CFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#1A1D24; --fg:#F3F4F6; --muted:#A7ADB8; --line:#2A2F39;
  --accent:#D91F3A; --accent-ink:#FFFFFF; --accent-soft:#2A1519; --accent-deep:#FF9AA8;
  --strong:#F3F4F6; --strong-ink:#0F1115; --info-bg:#172036; --info-fg:#C7D7FF; --calm:#5B8CFF; color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
[hidden]{display:none!important}
.loc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.loc b{font-size:18px;font-variant-numeric:tabular-nums;user-select:all;word-break:break-word}
.loc .row{display:flex;gap:8px;flex-wrap:wrap}
.small-btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}
.offline{font-size:13px;color:var(--muted);text-align:center;padding-block:4px}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button,a{font:inherit}
:focus-visible{outline:3px solid var(--calm);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:12px 4px;min-height:52px}
.icon-btn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;margin-left:-12px;cursor:pointer}
.pill-103{border:0;background:var(--accent);color:var(--accent-ink);height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;cursor:pointer}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:8px 8px}
.bottom{display:flex;flex-direction:column;gap:8px;padding-block:10px 16px}
h1{margin:0;font-size:32px;font-weight:800;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700}
p{margin:0}
.lead{font-size:20px;line-height:1.45}
.muted{color:var(--muted)}
.big{min-height:72px;border-radius:22px;border:0;font-size:20px;font-weight:800;cursor:pointer;padding:0 20px;width:100%}
.big.dark{background:var(--strong);color:var(--strong-ink)}
.big.red{background:var(--accent);color:var(--accent-ink)}
.big.light{background:var(--surface);color:var(--fg);border:2px solid var(--line)}
.link-btn{min-height:48px;border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:600;cursor:pointer}

/* home */
.call-card{border:0;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:26px;min-height:112px;padding:0 22px;display:flex;align-items:center;gap:18px;cursor:pointer;text-align:left}
.call-card .ring{width:68px;height:68px;border-radius:34px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.call-card b{display:block;font-size:26px;font-weight:800}
.call-card span{font-size:15px;opacity:.92}
.sit{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:22px;min-height:84px;padding:0 20px;display:flex;align-items:center;gap:16px;font-size:21px;font-weight:800;text-align:left;cursor:pointer}
.sit.primary{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.sit svg{flex-shrink:0;color:var(--accent)}
.sit.primary svg{color:inherit}
.list-item{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;min-height:64px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}
.list-item[disabled]{cursor:default;opacity:.62}
.list-item .t{font-size:17px;font-weight:700;display:block}
.list-item .s{font-size:14px;color:var(--muted);display:block;margin-top:2px}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent-deep);flex-shrink:0}
.tag.soon{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* flow */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.step-no{font-size:16px;font-weight:700;color:var(--accent-deep)}
.note{background:var(--info-bg);color:var(--info-fg);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.45}

/* metronome */
.metro{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;flex:1}
.beat{width:220px;height:220px;border-radius:50%;background:var(--accent-deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform 90ms ease-out}
:root .beat{background:#9F1239}
.beat.run{background:#C8102E}
.beat.hit{transform:scale(1.1)}
.beat b{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.beat span{font-size:16px;font-weight:600;opacity:.92}
.metro-hint{font-size:18px;font-weight:700;color:var(--accent-deep)}

/* timer */
.timer{background:var(--info-bg);color:var(--info-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer b{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* call */
.num-card{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none}
.num-card b{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1;user-select:all}
.num-row{background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:var(--fg);text-decoration:none;font-weight:600}
.num-row b{font-size:28px;font-weight:800;user-select:all}
ol.say{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.say li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.4}
ol.say li span{width:30px;height:30px;border-radius:15px;background:var(--strong);color:var(--strong-ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:6px 8px 10px;background:var(--surface)}
.tabs button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:12px;font-weight:600;min-height:52px;cursor:pointer}
.tabs button.on{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.beat{transition:none}.beat.hit{transform:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
(function(){
const I = {
  phone:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  heart:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/><path d="M3.2 12H8l1.5-3 3 6 1.5-3h6.8"/></svg>',
  drop:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7C9 7 6 10.3 6 14a6 6 0 0 0 12 0c0-3.7-3-7-6-11.3z"/></svg>',
  choke:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M9 13v3h6v-3"/><path d="M8 20h8"/></svg>',
  fire:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-1 2-2 3-3 3 0-2-1-4-3-6 0 4-4 7-4 13 0 4 3 7 7 7z"/></svg>',
  close:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'
};

// Flows: each step has title, body, optional note, and buttons [{label, go, style}]
// go: number = step index, 'next', 'done', 'call', 'flow:<id>'
const FLOWS = {
  cpr: { name:'Не дышит', steps:[
    { title:'Вам ничего не угрожает?', body:'Дорога, огонь, ток, газ — сначала уберите опасность или отойдите.', btns:[{label:'Безопасно', go:'next'}] },
    { title:'Человек не отвечает и не дышит?', body:'Громко окликните, потрясите за плечи. Запрокиньте голову и 10 секунд слушайте дыхание.', note:'Редкие хрипящие вдохи — это не дыхание.', btns:[{label:'Не дышит', go:'next'}, {label:'Дышит', go:'done:breathing', style:'light'}] },
    { title:'Позвоните 103', body:'Включите громкую связь и положите телефон рядом. Попросите кого-нибудь найти дефибриллятор.', btns:[{label:'Позвонил(а) — дальше', go:'next', startMetro:true}, {label:'Показать номер', go:'call', style:'light'}] },
    { kind:'metro' }
  ]},
  bleed: { name:'Сильно кровоточит', steps:[
    { title:'Позовите на помощь', body:'Пусть кто-то звонит 103, а вы сразу переходите к ране. Один — включите громкую связь.', btns:[{label:'Дальше', go:'next'}, {label:'Показать номер', go:'call', style:'light'}] },
    { title:'Сильно прижмите рану', body:'Ладонью через ткань, бинт или одежду. Давите всем весом и не отпускайте.', btns:[{label:'Давлю', go:'next'}] },
    { title:'Кровь пропитала ткань?', body:'Не снимайте её. Положите сверху ещё и продолжайте давить.', btns:[{label:'Дальше', go:'next'}] },
    { title:'Кровь из руки или ноги не останавливается?', body:'Наложите жгут или тугую закрутку на 5–7 см выше раны, поверх одежды. Запомните время.', btns:[{label:'Кровь остановилась', go:'done:bleed'}, {label:'Не останавливается', go:'call', style:'red'}] }
  ]},
  choke: { name:'Подавился', steps:[
    { title:'Человек может кашлять или говорить?', body:'Спросите: «Вы подавились?»', btns:[{label:'Нет, не может', go:'next', style:'red'}, {label:'Да, кашляет', go:'done:cough', style:'light'}] },
    { title:'5 ударов по спине', body:'Встаньте сбоку, наклоните человека вперёд. Основанием ладони 5 раз резко ударьте между лопатками.', btns:[{label:'Не помогло', go:'next'}, {label:'Предмет вышел', go:'done:choke', style:'light'}] },
    { title:'5 толчков в живот', body:'Встаньте сзади, обхватите руками. Кулак — чуть выше пупка, второй ладонью сверху. Резко 5 раз надавите внутрь и вверх.', btns:[{label:'Не помогло — снова удары', go:1}, {label:'Предмет вышел', go:'done:choke', style:'light'}, {label:'Потерял сознание', go:'flow:cpr:2', style:'red'}] }
  ]},
  burn: { name:'Ожог', steps:[
    { kind:'timer', title:'Охлаждайте водой 20 минут', body:'Прохладная проточная вода, не ледяная. Снимите кольца и часы, пока нет отёка.', btns:[{label:'Дальше', go:'next'}] },
    { title:'Закройте ожог', body:'Пищевой плёнкой или чистой тканью без ворса.', note:'Не мажьте маслом и кремом, не прикладывайте лёд, не вскрывайте пузыри.', btns:[{label:'Дальше', go:'next'}] },
    { title:'Нужна скорая?', body:'Звоните 103, если ожог больше ладони, на лице, кистях или в паху, от тока или химии, у ребёнка или пожилого.', btns:[{label:'Позвонить 103', go:'call', style:'red'}, {label:'Нет, справимся', go:'done:burn', style:'light'}] }
  ]}
};
const DONE = {
  breathing:{ title:'Человек дышит', body:'Позвоните 103. Поверните человека на бок, чтобы он не захлебнулся, и следите за дыханием до приезда скорой.' },
  bleed:{ title:'Продолжайте давить', body:'Не снимайте повязку и жгут. Укройте человека, чтобы он не замёрз, и ждите скорую.' },
  cough:{ title:'Пусть кашляет', body:'Не стучите по спине, пока человек кашляет. Будьте рядом. Перестал кашлять и дышать — вернитесь к ударам по спине.', back:'choke:1' },
  choke:{ title:'Дыхание восстановилось', body:'После толчков в живот обязательно покажите человека врачу, даже если всё прошло.' },
  burn:{ title:'Ожог закрыт', body:'Если появятся сильная боль, жар или гной — обратитесь к врачу.' }
};
const LIST = [
  { t:'Не дышит, нет сознания', s:'Реанимация с метрономом', flow:'cpr', urgent:true },
  { t:'Сильно кровоточит', s:'Кровь течёт струёй или быстро пропитывает ткань', flow:'bleed', urgent:true },
  { t:'Подавился', s:'Не может говорить, кашлять, дышать', flow:'choke', urgent:true },
  { t:'Ожог', s:'Термический, кипяток, солнечный', flow:'burn' },
  { t:'Признаки инсульта', s:'Перекос лица, слабость в руке, нарушение речи' },
  { t:'Сильная аллергия', s:'Отёк, трудно дышать после аллергена' },
  { t:'Судороги', s:'Непроизвольные подёргивания мышц' },
  { t:'Перелом', s:'Деформация, сильная боль, отёк' },
  { t:'Обморок', s:'Кратковременная потеря сознания' },
  { t:'Отравление', s:'Еда, лекарства, бытовая химия' }
];

const S = { screen:'home', flow:null, step:0, done:null, hist:[], tab:'home' };
const app = document.getElementById('app');

/* ---------- audio, metronome, timer ---------- */
let ctx = null, wake = null;
function ensureAudio(){
  try{ if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); } if(ctx && ctx.resume) ctx.resume(); }catch(e){}
}
function beep(){
  try{ if(ctx){ const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.08);} }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
}
async function lockScreen(on){
  try{
    if(on && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null}); }
    if(!on && wake){ await wake.release(); wake=null; }
  }catch(e){ wake=null; }
}
const M = { running:false, count:0, timer:null, nextAt:0, bpm:110 };
function metroStart(){
  ensureAudio(); lockScreen(true);
  clearTimeout(M.timer); M.running = true; M.nextAt = Date.now(); metroTick(); paintMetro();
}
function metroStop(){ clearTimeout(M.timer); M.running=false; paintMetro(); }
function metroReset(){ metroStop(); M.count=0; lockScreen(false); }
function metroTick(){
  if(!M.running) return;
  beep(); M.count++;
  const el = document.getElementById('beat');
  if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),110); document.getElementById('beatN').textContent = M.count; }
  M.nextAt += 60000/M.bpm;
  M.timer = setTimeout(metroTick, Math.max(0, M.nextAt - Date.now()));
}
function paintMetro(){
  const el = document.getElementById('beat'); if(!el) return;
  el.classList.toggle('run', M.running);
  document.getElementById('beatN').textContent = M.count;
  document.getElementById('metroHint').textContent = M.running ? 'Нажимайте на каждый сигнал' : 'Пауза — продолжите как можно скорее';
  const b = document.getElementById('metroBtn');
  b.textContent = M.running ? 'Пауза' : 'Продолжить';
  b.className = 'big ' + (M.running ? 'light' : 'red');
}

const T = { end:0, timer:null, total:20*60 };
function timerStart(){ ensureAudio(); T.end = Date.now() + T.total*1000; clearInterval(T.timer); T.timer = setInterval(paintTimer, 500); paintTimer(); }
function timerLeft(){ return T.end ? Math.max(0, Math.round((T.end - Date.now())/1000)) : T.total; }
function paintTimer(){
  const el = document.getElementById('tLeft'); if(!el) return;
  const left = timerLeft(); const m = Math.floor(left/60), s = left%60;
  el.textContent = m + ':' + String(s).padStart(2,'0');
  const b = document.getElementById('tBtn');
  if(b){ b.hidden = !!T.end; }
  const d = document.getElementById('tDone');
  if(d){ d.hidden = !(T.end && left===0); }
  if(T.end && left===0){ clearInterval(T.timer); T.timer=null; beep(); }
}

/* ---------- navigation ---------- */
function go(screen, extra){
  S.hist.push({screen:S.screen, flow:S.flow, step:S.step, done:S.done});
  Object.assign(S, {screen}, extra||{});
  render();
}
function back(){
  const prev = S.hist.pop();
  if(!prev){ S.screen='home'; } else Object.assign(S, prev);
  if(!(S.screen==='flow' && FLOWS[S.flow].steps[S.step].kind==='metro')) metroStop();
  render();
}
function home(){ metroReset(); S.hist=[]; S.screen='home'; S.tab='home'; render(); }

function act(btn){
  const g = btn.go;
  if(btn.startMetro) { ensureAudio(); }
  if(g==='next'){ go('flow', {step:S.step+1}); }
  else if(typeof g==='number'){ go('flow', {step:g}); }
  else if(g==='call'){ go('call'); }
  else if(g.startsWith('done:')){ go('done', {done:g.slice(5)}); }
  else if(g.startsWith('flow:')){ const [,f,st] = g.split(':'); go('flow', {flow:f, step:+st||0}); }
  const st = S.screen==='flow' && FLOWS[S.flow].steps[S.step];
  if(st && st.kind==='metro' && !M.running){ M.count=0; metroStart(); }
}

/* ---------- views ---------- */
function topBar(left){
  return '<div class="top">' + left + '<button class="pill-103" data-a="call">' + I.phone.replace('width="24" height="24"','width="18" height="18"') + 'Позвонить 103</button></div>';
}
function tabs(){
  return '<nav class="tabs" aria-label="Меню">' +
    '<button data-a="home" class="'+(S.screen==='home'?'on':'')+'">'+I.home+'Помощь</button>' +
    '<button data-a="list" class="'+(S.screen==='list'?'on':'')+'">'+I.list+'Все ситуации</button>' +
    '<button data-a="call" class="'+(S.screen==='call'?'on':'')+'">'+I.phone+'Вызов</button></nav>';
}

function vHome(){
  return '<div class="scroll" style="padding-top:16px">' +
    '<button class="call-card" data-a="call"><div class="ring">'+I.phone.replace(/24/g,'32')+'</div><div><b>Позвонить 103</b><span>Скорая помощь</span></div></button>' +
    '<h1 style="margin-top:8px;font-size:28px">Что случилось?</h1>' +
    '<button class="sit primary" data-flow="cpr">'+I.heart+'Не дышит</button>' +
    '<button class="sit" data-flow="bleed">'+I.drop+'Сильно кровоточит</button>' +
    '<button class="sit" data-flow="choke">'+I.choke+'Подавился</button>' +
    '<button class="sit" data-flow="burn">'+I.fire+'Ожог</button>' +
    '<button class="link-btn" data-a="list" style="color:var(--fg);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">Другая ситуация '+I.chev+'</button>' +
  '</div>' + tabs();
}
function vList(){
  return '<div class="top"><h1 style="font-size:26px">Все ситуации</h1></div><div class="scroll">' +
    LIST.map(x => '<button class="list-item" '+(x.flow?'data-flow="'+x.flow+'"':'disabled')+'><div style="flex:1;min-width:0"><span class="t">'+x.t+'</span><span class="s">'+x.s+'</span></div>' +
      (x.flow ? (x.urgent?'<span class="tag">Срочно</span>':'') + I.chev : '<span class="tag soon">Скоро</span>') + '</button>').join('') +
  '</div>' + tabs();
}
function vFlow(){
  const f = FLOWS[S.flow], st = f.steps[S.step], n = f.steps.length;
  const prog = '<div class="progress" role="img" aria-label="Шаг '+(S.step+1)+' из '+n+'">' + f.steps.map((_,k)=>'<i class="'+(k<=S.step?'on':'')+'"></i>').join('') + '</div>';
  const head = topBar('<button class="icon-btn" data-a="home" aria-label="Закрыть">'+I.close+'</button>') + prog;
  const prevBtn = S.hist.length && S.hist[S.hist.length-1].screen==='flow' ? '<button class="link-btn" data-a="back">← Предыдущий шаг</button>' : '';
  if(st.kind==='metro'){
    return head + '<div class="scroll"><div class="metro">' +
      '<h1 style="font-size:30px">Давите на грудь в такт</h1>' +
      '<p style="font-size:18px;line-height:1.45">Центр груди, руки прямые, на 5–6 см. Не останавливайтесь до приезда скорой.</p>' +
      '<div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:240px"><div id="beat" class="beat" aria-hidden="true"><b id="beatN">0</b><span>нажатий</span></div></div>' +
      '<span id="metroHint" class="metro-hint">Нажимайте на каждый сигнал</span></div></div>' +
      '<div class="bottom"><button id="metroBtn" class="big light" data-a="metro">Пауза</button>' + prevBtn + '</div>';
  }
  let body = '<span class="step-no">Шаг '+(S.step+1)+' из '+n+'</span><h1>'+st.title+'</h1><p class="lead">'+st.body+'</p>';
  if(st.note) body += '<div class="note">'+st.note+'</div>';
  if(st.kind==='timer') body += '<div class="timer"><b id="tLeft">20:00</b><button id="tBtn" class="big dark" data-a="timer" style="min-height:60px">Запустить таймер</button><span id="tDone" hidden style="font-weight:700">Готово — 20 минут прошло</span></div>';
  const btns = st.btns.map((b,k)=>'<button class="big '+(b.style||'dark')+'" data-btn="'+k+'">'+b.label+'</button>').join('');
  return head + '<div class="scroll" style="padding-top:20px">'+body+'</div><div class="bottom">'+btns+prevBtn+'</div>';
}
function vDone(){
  const d = DONE[S.done];
  return topBar('<button class="icon-btn" data-a="home" aria-label="Закрыть">'+I.close+'</button>') +
    '<div class="scroll" style="padding-top:20px"><h1>'+d.title+'</h1><p class="lead">'+d.body+'</p></div>' +
    '<div class="bottom">' + (d.back ? '<button class="big red" data-a="back">Перестал дышать</button>' : '<button class="big red" data-a="call">Позвонить 103</button>') +
    '<button class="big light" data-a="home">На главную</button></div>';
}
function vCall(){
  return '<div class="top"><button class="icon-btn" data-a="back" aria-label="Назад">'+I.back+'</button></div>' +
    '<div class="scroll">' +
    '<h1 style="font-size:28px">Экстренный вызов</h1>' +
    '<a class="num-card" href="tel:103"><div><span style="font-size:15px;font-weight:600;opacity:.92">Скорая помощь</span><br><b>103</b></div><div class="call-card" style="width:auto;min-height:0;padding:0;background:transparent"><div class="ring">'+I.phone.replace(/24/g,'30')+'</div></div></a>' +
    '<a class="num-row" href="tel:112"><span>Единая служба спасения</span><b>112</b></a>' +
    '<div class="loc"><span class="muted" style="font-size:14px;font-weight:600">Где вы находитесь</span>' +
      '<b id="locText">Нажмите, чтобы определить</b>' +
      '<div class="row"><button class="small-btn" data-a="locate">Определить</button><button class="small-btn" data-a="copyloc" id="copyBtn" hidden>Скопировать</button></div></div>' +
    '<h2 style="margin-top:6px">Что сказать диспетчеру</h2>' +
    '<ol class="say"><li><span>1</span>Адрес: улица, дом, подъезд, этаж</li><li><span>2</span>Что случилось и сколько пострадавших</li><li><span>3</span>Возраст, есть ли сознание и дыхание</li><li><span>4</span>Ваш номер телефона</li></ol>' +
    '<div class="note">Не кладите трубку первым — диспетчер подскажет, что делать.</div>' +
    '</div>' + (S.hist.some(h=>h.screen==='flow') ? '<div class="bottom"><button class="big dark" data-a="back">Вернуться к инструкции</button></div>' : tabs());
}

function render(){
  const v = {home:vHome, list:vList, flow:vFlow, done:vDone, call:vCall}[S.screen];
  app.innerHTML = v();
  if(S.screen==='flow'){
    const st = FLOWS[S.flow].steps[S.step];
    if(st.kind==='metro') paintMetro();
    if(st.kind==='timer') paintTimer();
  }
  const sc = app.querySelector('.scroll'); if(sc) sc.scrollTop = 0;
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.flow){ metroReset(); S.hist=[]; S.hist.push({screen:'home'}); Object.assign(S,{screen:'flow', flow:t.dataset.flow, step:0}); render(); return; }
  if(t.dataset.btn!==undefined){ act(FLOWS[S.flow].steps[S.step].btns[+t.dataset.btn]); return; }
  const a = t.dataset.a;
  if(a==='home') home();
  else if(a==='list'){ S.hist=[]; S.screen='list'; render(); }
  else if(a==='call') go('call');
  else if(a==='back') back();
  else if(a==='metro') (M.running ? metroStop() : metroStart());
  else if(a==='timer') timerStart();
  else if(a==='locate') locate();
  else if(a==='copyloc') copyLoc();
});

let lastLoc = '';
function locate(){
  const el = document.getElementById('locText');
  if(!navigator.geolocation){ el.textContent = 'Телефон не поддерживает определение места'; return; }
  el.textContent = 'Определяю…';
  navigator.geolocation.getCurrentPosition(p => {
    const lat = p.coords.latitude.toFixed(5), lon = p.coords.longitude.toFixed(5);
    lastLoc = lat + ', ' + lon;
    const e2 = document.getElementById('locText'); if(!e2) return;
    e2.textContent = lastLoc + ' (±' + Math.round(p.coords.accuracy) + ' м)';
    const c = document.getElementById('copyBtn'); if(c) c.hidden = false;
  }, err => {
    const e2 = document.getElementById('locText'); if(!e2) return;
    e2.textContent = err.code === 1 ? 'Нет разрешения на геолокацию. Назовите адрес по табличке на доме.' : 'Не удалось определить. Назовите адрес по табличке на доме.';
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}
function copyLoc(){
  const c = document.getElementById('copyBtn');
  const ok = () => { if(c) c.textContent = 'Скопировано'; };
  try{ navigator.clipboard.writeText(lastLoc).then(ok, ()=>{}); }catch(e){}
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && M.running) lockScreen(true); });

render();
})();
</script>
</body>
</html>
