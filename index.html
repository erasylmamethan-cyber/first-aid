<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Первая помощь</title>
<meta name="description" content="Пошаговая первая помощь: реанимация с метрономом, кровотечение, удушье, ожог, низкий сахар. Работает без интернета.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Первая помощь">
<style>
*{box-sizing:border-box}
/* Layout: one-column phone app, max 460px, centered on desktop; huge tap targets for a reader in panic */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#111827; --muted:#4B5563; --line:#E5E7EB;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#FFF1F2; --accent-deep:#9F1239;
  --strong:#111827; --strong-ink:#FFFFFF; --info-bg:#EFF4FF; --info-fg:#1E3A8A; --calm:#1D4ED8;
  --warn-bg:#FFF7E6; --warn-fg:#7A4100; --scrim:rgba(17,24,39,.55);
  --font:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#1A1D24; --fg:#F3F4F6; --muted:#A7ADB8; --line:#2A2F39;
  --accent:#D91F3A; --accent-ink:#FFFFFF; --accent-soft:#2A1519; --accent-deep:#FF9AA8;
  --strong:#F3F4F6; --strong-ink:#0F1115; --info-bg:#172036; --info-fg:#C7D7FF; --calm:#5B8CFF;
  --warn-bg:#2B2210; --warn-fg:#FFD58A; --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#1A1D24; --fg:#F3F4F6; --muted:#A7ADB8; --line:#2A2F39;
  --accent:#D91F3A; --accent-ink:#FFFFFF; --accent-soft:#2A1519; --accent-deep:#FF9AA8;
  --strong:#F3F4F6; --strong-ink:#0F1115; --info-bg:#172036; --info-fg:#C7D7FF; --calm:#5B8CFF;
  --warn-bg:#2B2210; --warn-fg:#FFD58A; --scrim:rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
[hidden]{display:none!important}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button,a{font:inherit}
:focus-visible{outline:3px solid var(--calm);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:12px 4px;min-height:52px}
.icon-btn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;margin-left:-12px;cursor:pointer}
.pill-103{border:0;background:var(--accent);color:var(--accent-ink);height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;cursor:pointer}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:8px 8px}
.bottom{display:flex;flex-direction:column;gap:8px;padding-block:10px 16px}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700}
p{margin:0}
.lead{font-size:19px;line-height:1.45}
.muted{color:var(--muted)}
.big{min-height:68px;border-radius:22px;border:0;font-size:20px;font-weight:800;cursor:pointer;padding:0 20px;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.big.dark{background:var(--strong);color:var(--strong-ink)}
.big.red{background:var(--accent);color:var(--accent-ink)}
.big.light{background:var(--surface);color:var(--fg);border:2px solid var(--line)}
.big.small{min-height:54px;font-size:17px}
.link-btn{min-height:48px;border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:600;cursor:pointer}

/* steps */
ol.do{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:d}
ol.do li{counter-increment:d;display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.4}
ol.do li::before{content:counter(d);flex-shrink:0;width:30px;height:30px;border-radius:15px;background:var(--strong);color:var(--strong-ink);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:-1px}
ol.do b{font-weight:800}
.alert{background:var(--accent-soft);color:var(--fg);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45}
.alert strong{color:var(--accent-deep)}
.alert .small-btn{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0}
.note{background:var(--info-bg);color:var(--info-fg);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.45}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.45}
.small-btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.step-no{font-size:15px;font-weight:700;color:var(--accent-deep)}

/* home & list */
.call-card{border:0;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:26px;min-height:112px;padding:0 22px;display:flex;align-items:center;gap:18px;cursor:pointer;text-align:left}
.call-card .ring{width:68px;height:68px;border-radius:34px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.call-card b{display:block;font-size:26px;font-weight:800}
.call-card span{font-size:15px;opacity:.92}
.sit{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:22px;min-height:80px;padding:0 20px;display:flex;align-items:center;gap:16px;font-size:21px;font-weight:800;text-align:left;cursor:pointer}
.sit.primary{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.sit svg{flex-shrink:0;color:var(--accent)}
.sit.primary svg{color:inherit}
.list-item{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;min-height:64px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}
.list-item[disabled]{cursor:default;opacity:.62}
.list-item .t{font-size:17px;font-weight:700;display:block}
.list-item .s{font-size:14px;color:var(--muted);display:block;margin-top:2px}
.tag{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent-deep);flex-shrink:0}
.tag.soon{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* metronome */
.metro{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;flex:1}
.beat{width:210px;height:210px;border-radius:50%;background:#9F1239;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform 90ms ease-out, background 200ms}
.beat.run{background:#C8102E}
.beat.breath{background:#1D4ED8}
.beat.hit{transform:scale(1.1)}
.beat b{font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.beat span{font-size:16px;font-weight:600;opacity:.92}
.metro-hint{font-size:18px;font-weight:700;line-height:1.35;color:var(--accent-deep)}
.metro-hint.breath{color:var(--calm)}

/* timer */
.timer{background:var(--info-bg);color:var(--info-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.timer b{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

/* call */
.num-card{border:0;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left}
.num-card b{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1}
.num-row{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:var(--fg);font-weight:600;cursor:pointer;text-align:left}
.num-row b{font-size:28px;font-weight:800}
ol.say{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.say li{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.4}
ol.say li span{width:30px;height:30px;border-radius:15px;background:var(--strong);color:var(--strong-ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.loc b{font-size:18px;font-variant-numeric:tabular-nums;user-select:all;word-break:break-word}
.loc .row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:6px 8px 10px;background:var(--surface)}
.tabs button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:12px;font-weight:600;min-height:52px;cursor:pointer}
.tabs button.on{color:var(--accent)}

/* call confirmation sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:28px 28px 0 0;padding:24px max(20px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:24px;font-weight:800}
.sheet .num{font-size:44px;font-weight:800;color:var(--accent);line-height:1}
@media (prefers-reduced-motion: reduce){.beat{transition:none}.beat.hit{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h2 id="sheetTitle">Позвонить в скорую?</h2>
    <div class="num" id="sheetNum">103</div>
    <p class="muted" style="font-size:15px">Звонок экстренный. Подтвердите, что вызов нужен.</p>
    <a class="big red" id="sheetCall" href="tel:103">Да, позвонить 103</a>
    <button class="big light small" id="sheetCancel">Отмена</button>
  </div>
</div>

<script>
(function(){
const I = {
  phone:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  heart:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/><path d="M3.2 12H8l1.5-3 3 6 1.5-3h6.8"/></svg>',
  drop:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7C9 7 6 10.3 6 14a6 6 0 0 0 12 0c0-3.7-3-7-6-11.3z"/></svg>',

  sugar:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M12 12h.01M9 15h.01M15 15h.01"/></svg>',
  close:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  back:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  home:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>',
  list:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'
};

   go: 'next' | число (индекс шага) | 'done:<id>' | 'call' (подтверждение звонка) | 'flow:<id>:<шаг>' */
const FLOWS = {
  cpr: { name:'Не дышит', steps:[
    { title:'Убедитесь, что вам ничего не угрожает',
      body:'Дорога, огонь, ток, газ, обрушение — сначала уберите опасность или отойдите. Помогать можно только в безопасном месте.',
      btns:[{label:'Безопасно — дальше', go:'next'}] },
    { title:'Проверьте сознание и дыхание',
      list:['Громко окликните и <b>потрясите за плечи</b>.','Нет ответа — <b>запрокиньте голову</b> и поднимите подбородок.','<b>10 секунд</b> смотрите, слушайте и ощущайте дыхание.'],
      note:'Редкие хрипящие вдохи — это <b>не дыхание</b>. Сомневаетесь — считайте, что человек не дышит.',
      btns:[{label:'Не дышит или дышит ненормально', go:'next', style:'red'}, {label:'Дышит нормально', go:'done:breathing', style:'light'}] },
    { title:'Позвоните 103 и найдите дефибриллятор',
      list:['Позвоните <b>103</b>, включите громкую связь, положите телефон рядом.','Пусть кто-нибудь принесёт <b>дефибриллятор (АНД)</b>, если он есть поблизости, — он сам подскажет, что делать.'],
      btns:[{label:'Начать реанимацию', go:'next', style:'red'}, {label:'Позвонить 103', go:'call', style:'light'}] },
    { kind:'metro' }
  ]},
  bleed: { name:'Сильно кровоточит', steps:[
    { title:'Сразу прижмите рану',
      list:['Если есть — наденьте <b>перчатки</b> или пакет на руку.','Положите на рану <b>сложенный бинт</b>, салфетку или чистую ткань.','<b>Давите ладонью сильно</b>, всем весом.','Держите <b>не меньше 10 минут</b>. Не поднимайте ткань, чтобы посмотреть.'],
      warn:'В ране торчит предмет — <b>не вынимайте</b>. Давите по бокам от него.',
      btns:[{label:'Прижал(а) — дальше', go:'next'}] },
    { title:'Наложите давящую повязку',
      list:['Ткань с раны <b>не убирайте</b>.','Сверху положите <b>плотный валик</b> — нераспечатанный бинт или свёрнутую ткань.','<b>Туго прибинтуйте</b>: каждый виток закрывает предыдущий наполовину.','Узел завяжите <b>сбоку</b>, не на самой ране.','Проверьте пальцы ниже повязки: <b>синеют или немеют</b> — чуть ослабьте.'],
      btns:[{label:'Кровь остановилась', go:'done:bleed'}, {label:'Повязка промокла', go:'next', style:'light'}] },
    { title:'Повязка промокла',
      list:['Старую повязку <b>не снимайте</b>.','Положите сверху <b>ещё ткань</b> и снова туго прибинтуйте.','Снова <b>сильно давите</b> рукой поверх.'],
      warn:'Рана на <b>шее, груди или животе</b> — жгут не накладывают. Только давите до приезда скорой.',
      btns:[{label:'Кровь остановилась', go:'done:bleed'}, {label:'Рука или нога — кровь не останавливается', go:'next', style:'red'}] },
    { title:'Наложите жгут',
      list:['Только на <b>руку или ногу</b>, если давление не помогло.','Место — <b>на 5–7 см выше раны</b>, не на сустав. Лучше на кожу, можно поверх тонкой одежды.','Жгут или <b>широкая полоса ткани</b> (шире 4 см). Не верёвка и не провод.','<b>Затягивайте, пока кровь не остановится.</b> Закрутите палкой или ручкой, если не хватает сил.','Не держит — второй жгут <b>выше первого</b>.','<b>Запишите время</b> на коже или на жгуте.'],

/* ---------- звук, метроном, таймер ---------- */
let ctx = null, wake = null;
function ensureAudio(){ try{ if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); } if(ctx && ctx.resume) ctx.resume(); }catch(e){} }
function tone(freq, dur, vib){
  try{ if(ctx){ const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);} }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(vib); }catch(e){}
}
async function lockScreen(on){
  try{
    if(on && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null}); }
    if(!on && wake){ await wake.release(); wake=null; }
  }catch(e){ wake=null; }
}
// 110 в минуту; 30 нажатий : 2 вдоха, либо только нажатия
const M = { running:false, count:0, total:0, phase:'press', onlyComp:false, timer:null, tick2:null, nextAt:0, breathEnd:0, bpm:110 };
function metroStart(){
  ensureAudio(); lockScreen(true);
  clearTimeout(M.timer); clearInterval(M.tick2);
  M.running = true; M.phase = 'press'; M.nextAt = Date.now(); metroTick(); paintMetro();
}
function metroStop(){ clearTimeout(M.timer); clearInterval(M.tick2); M.running=false; paintMetro(); }
function metroReset(){ metroStop(); M.count=0; M.total=0; M.phase='press'; lockScreen(false); }
function metroTick(){
  if(!M.running || M.phase!=='press') return;
  M.count++; M.total++;
  tone(M.count===1 && !M.onlyComp ? 1320 : 880, 0.06, 35);
  const el = document.getElementById('beat');
  if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),110); }
  paintMetro();
  M.nextAt += 60000/M.bpm;
  const wait = Math.max(0, M.nextAt - Date.now());
  if(!M.onlyComp && M.count>=30) M.timer = setTimeout(breathStart, wait);
  else M.timer = setTimeout(metroTick, wait);
}
function breathStart(){
  if(!M.running) return;
  M.phase='breath'; M.breathEnd = Date.now()+6000;
  tone(440, 0.4, 250);
  clearInterval(M.tick2); M.tick2 = setInterval(()=>{ if(Date.now()>=M.breathEnd) breathEnd(); else paintMetro(); }, 250);
  paintMetro();
}
function breathEnd(){
  clearInterval(M.tick2); M.phase='press'; M.count=0;
  if(M.running){ M.nextAt = Date.now(); metroTick(); }
  paintMetro();
}
function paintMetro(){
  const el = document.getElementById('beat'); if(!el) return;
  const breath = M.phase==='breath';
  el.classList.toggle('run', M.running && !breath);
  el.classList.toggle('breath', breath);
  const n = document.getElementById('beatN'), l = document.getElementById('beatL'), h = document.getElementById('metroHint');
  if(breath){
    n.textContent = '2'; l.textContent = 'вдоха · ' + Math.max(0, Math.ceil((M.breathEnd-Date.now())/1000)) + ' с';
    h.innerHTML = 'Запрокиньте голову, зажмите нос.<br>2 вдоха по 1 секунде — грудь должна подняться.';
  } else if(M.onlyComp){
    n.textContent = M.total; l.textContent = 'нажатий';
    h.textContent = M.running ? 'Нажимайте на каждый сигнал, без пауз' : 'Пауза — продолжите как можно скорее';
  } else {
    n.textContent = M.count; l.textContent = 'из 30';
    h.textContent = M.running ? 'Нажимайте на каждый сигнал' : 'Пауза — продолжите как можно скорее';
  }
  h.className = 'metro-hint' + (breath ? ' breath' : '');
  const b = document.getElementById('metroBtn');
  if(breath){ b.textContent = 'Вдохи сделаны'; b.className = 'big dark'; }
  else { b.textContent = M.running ? 'Пауза' : 'Продолжить'; b.className = 'big ' + (M.running ? 'light' : 'red'); }
  const m = document.getElementById('modeBtn');
  if(m) m.textContent = M.onlyComp ? 'Могу делать вдохи — режим 30 : 2' : 'Не умею или не могу делать вдохи';
}

const T = { end:0, timer:null, total:0 };
function timerStart(min){ ensureAudio(); T.total = min*60; T.end = Date.now() + T.total*1000; clearInterval(T.timer); T.timer = setInterval(paintTimer, 500); paintTimer(); }
function paintTimer(){
  const el = document.getElementById('tLeft'); if(!el) return;
  const st = FLOWS[S.flow].steps[S.step];
  const total = st.minutes*60;
  const active = T.end && T.total===total;
  const left = active ? Math.max(0, Math.round((T.end - Date.now())/1000)) : total;
  el.textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
  document.getElementById('tBtn').hidden = !!active;
  document.getElementById('tDone').hidden = !(active && left===0);
  if(active && left===0 && T.timer){ clearInterval(T.timer); T.timer=null; tone(660,0.5,[200,100,200]); }
}

/* ---------- подтверждение звонка ---------- */
const sheet = document.getElementById('sheet');
function askCall(num){
  num = num || '103';
  document.getElementById('sheetNum').textContent = num;
  document.getElementById('sheetTitle').textContent = num==='103' ? 'Позвонить в скорую?' : 'Позвонить в службу спасения?';
  const a = document.getElementById('sheetCall'); a.href = 'tel:' + num; a.textContent = 'Да, позвонить ' + num;
  sheet.hidden = false; a.focus();
}
function closeSheet(){ sheet.hidden = true; }
sheet.addEventListener('click', e => { if(e.target===sheet || e.target.id==='sheetCancel') closeSheet(); });
document.getElementById('sheetCall').addEventListener('click', () => setTimeout(closeSheet, 300));
document.addEventListener('keydown', e => { if(e.key==='Escape' && !sheet.hidden) closeSheet(); });

/* ---------- навигация ---------- */
function snapshot(){ return {screen:S.screen, flow:S.flow, step:S.step, done:S.done}; }
function go(screen, extra){ S.hist.push(snapshot()); Object.assign(S, {screen}, extra||{}); afterNav(); }
function back(){
  const prev = S.hist.pop();
  if(!prev) S.screen='home'; else Object.assign(S, prev);
  afterNav();
}
function home(){ metroReset(); S.hist=[]; S.screen='home'; render(); }
function isMetro(){ return S.screen==='flow' && FLOWS[S.flow].steps[S.step].kind==='metro'; }
function afterNav(){
  if(isMetro()){ if(!M.running){ M.count=0; M.total=0; metroStart(); } }
  else metroStop();
  render();
}
function act(btn){
  const g = btn.go;
  if(g==='call') return askCall('103');
  if(g==='next') return go('flow', {step:S.step+1});
  if(typeof g==='number') return go('flow', {step:g});
  if(g.startsWith('done:')) return go('done', {done:g.slice(5)});
  if(g.startsWith('flow:')){ const p = g.split(':'); return go('flow', {flow:p[1], step:+p[2]||0}); }
}

    '<button class="num-card" data-call="103"><div><span style="font-size:15px;font-weight:600;opacity:.92">Скорая помощь</span><br><b>103</b></div><div class="call-card" style="width:auto;min-height:0;padding:0;background:transparent"><div class="ring">'+I.phone.replace(/24/g,'30')+'</div></div></button>' +
    '<button class="num-row" data-call="112"><span>Единая служба спасения</span><b>112</b></button>' +
    '<div class="loc"><span class="muted" style="font-size:14px;font-weight:600">Где вы находитесь</span>' +
      '<b id="locText">Нажмите, чтобы определить</b>' +
      '<div class="row"><button class="small-btn" data-a="locate">Определить</button><button class="small-btn" data-a="copyloc" id="copyBtn" hidden>Скопировать</button></div></div>' +
    '<h2 style="margin-top:6px">Что сказать диспетчеру</h2>' +
    '<ol class="say"><li><span>1</span>Адрес: улица, дом, подъезд, этаж</li><li><span>2</span>Что случилось и сколько пострадавших</li><li><span>3</span>Возраст, есть ли сознание и дыхание</li><li><span>4</span>Ваш номер телефона</li></ol>' +
    '<div class="note">Не кладите трубку первым — диспетчер подскажет, что делать.</div>' +
    '</div>' + (fromFlow ? '<div class="bottom"><button class="big dark" data-a="back">Вернуться к инструкции</button></div>' : tabs());
}

function render(){
  const v = {home:vHome, list:vList, flow:vFlow, done:vDone, call:vCall}[S.screen];
  app.innerHTML = v();
  if(isMetro()) paintMetro();
  if(S.screen==='flow' && FLOWS[S.flow].steps[S.step].kind==='timer') paintTimer();
  const sc = app.querySelector('.scroll'); if(sc) sc.scrollTop = 0;
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.flow){ metroReset(); S.hist=[{screen:'home'}]; Object.assign(S,{screen:'flow', flow:t.dataset.flow, step:0}); render(); return; }
  if(t.dataset.btn!==undefined){ act(FLOWS[S.flow].steps[S.step].btns[+t.dataset.btn]); return; }
  if(t.dataset.dbtn!==undefined){ act(DONE[S.done].btns[+t.dataset.dbtn]); return; }
  if(t.dataset.call){ askCall(t.dataset.call); return; }
  const a = t.dataset.a;
  if(a==='home') home();
  else if(a==='list'){ S.hist=[]; S.screen='list'; render(); }
  else if(a==='call') askCall('103');
  else if(a==='callscreen'){ S.hist=[]; S.screen='call'; render(); }
  else if(a==='back') back();
  else if(a==='metro'){ if(M.phase==='breath') breathEnd(); else (M.running ? metroStop() : metroStart()); }
  else if(a==='mode'){ M.onlyComp = !M.onlyComp; M.count=0; M.total=0; if(M.phase==='breath') breathEnd(); paintMetro(); }
  else if(a==='timer') timerStart(FLOWS[S.flow].steps[S.step].minutes);
  else if(a==='locate') locate();
  else if(a==='copyloc') copyLoc();
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && M.running) lockScreen(true); });

let lastLoc = '';
function locate(){
  const el = document.getElementById('locText');
  if(!navigator.geolocation){ el.textContent = 'Телефон не поддерживает определение места'; return; }
  el.textContent = 'Определяю…';
  navigator.geolocation.getCurrentPosition(p => {
    lastLoc = p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5);
    const e2 = document.getElementById('locText'); if(!e2) return;
    e2.textContent = lastLoc + ' (±' + Math.round(p.coords.accuracy) + ' м)';
    const c = document.getElementById('copyBtn'); if(c) c.hidden = false;
  }, err => {
    const e2 = document.getElementById('locText'); if(!e2) return;
    e2.textContent = err.code === 1 ? 'Нет разрешения на геолокацию. Назовите адрес по табличке на доме.' : 'Не удалось определить. Назовите адрес по табличке на доме.';
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
}
function copyLoc(){
  const c = document.getElementById('copyBtn');
  try{ navigator.clipboard.writeText(lastLoc).then(()=>{ if(c) c.textContent = 'Скопировано'; }, ()=>{}); }catch(e){}
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
render();
})();
</script>
</body>
</html>
